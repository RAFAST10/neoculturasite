<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 140" width="415" height="140" role="img" aria-label="Neocultura Ambiental - Licenciamento Integrado">
  <!-- Símbolo: folha, camadas de solo e curvas de nível -->
  <g transform="translate(8,8)">
    <rect x="0" y="0" width="124" height="124" rx="28" fill="#1E3F2B"/>
    <!-- curvas de nível -->
    <g fill="none" stroke="#4A6B53" stroke-width="1.6" opacity="0.9">
      <path d="M8 60 C26 44, 46 44, 62 56 S96 70, 116 52"/>
      <path d="M8 46 C28 30, 50 30, 66 42 S100 56, 116 38"/>
      <path d="M8 74 C26 60, 48 62, 64 72 S98 84, 116 68"/>
    </g>
    <!-- folha -->
    <path d="M34 92 C34 56, 62 34, 102 30 C100 68, 76 96, 34 92 Z" fill="#D4BEA8"/>
    <path d="M34 92 L82 46" stroke="#1E3F2B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- camadas de solo -->
    <g fill="none" stroke="#B89778" stroke-width="4" stroke-linecap="round">
      <path d="M14 104 Q34 98 54 104 T94 104 T114 104"/>
      <path d="M22 114 Q40 109 58 114 T94 114 T106 114"/>
    </g>
  </g>
  <!-- Tipografia -->
  <text x="150" y="64" font-family="Plus Jakarta Sans, Montserrat, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1E3F2B" letter-spacing="-0.5">Neocultura</text>
  <text x="150" y="92" font-family="Plus Jakarta Sans, Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#B89778" letter-spacing="6">AMBIENTAL</text>
  <line x1="150" y1="104" x2="330" y2="104" stroke="#D4BEA8" stroke-width="1.5"/>
  <text x="150" y="124" font-family="Inter, Open Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#4A6B53" letter-spacing="3.2">LICENCIAMENTO INTEGRADO</text>
</svg>
